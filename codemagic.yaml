workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true

    integrations:
      app_store_connect: codemagic  # Codemagic 대시보드에서 연결한 이름과 동일해야 함

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.teman.app

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Set up code signing settings on macOS build machine
        script: |
          xcode-project use-profiles

      - name: Set build number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number 6768842296) + 1))
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          flutter build ipa \
            --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - musudang411@gmail.com  # 빌드 결과 알림 이메일
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: Android Google Play Release
    max_build_duration: 60
    instance_type: linux_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true

    environment:
      groups:
        - google_play_credentials # Codemagic UI에서 설정해야 함
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release \
            --build-name=$(grep 'version: ' pubspec.yaml | sed 's/version: //;s/+.*//') \
            --build-number=$(grep 'version: ' pubspec.yaml | sed 's/.*+//')

    artifacts:
      - build/app/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - musudang411@gmail.com
        notify:
          success: true
          failure: true
      # Google Play 배포를 원하시면 서비스 계정 JSON을 Codemagic에 등록하고 아래 주석을 해제하세요
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
