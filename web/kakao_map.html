<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
  </style>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=a6e36ae0b5f7259156d9c7dd2b9fc113"></script>
</head>
<body>
  <div id="map"></div>
  <script>
    var map;
    var markers = [];
    var params = new URLSearchParams(window.location.search);
    var lat = parseFloat(params.get('lat')) || 37.5665;
    var lng = parseFloat(params.get('lng')) || 126.9780;

    var container = document.getElementById('map');
    var options = {
      center: new kakao.maps.LatLng(lat, lng),
      level: 5
    };
    map = new kakao.maps.Map(container, options);

    // My location marker (blue)
    var myMarker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(lat, lng),
      map: map
    });
    var myInfo = new kakao.maps.InfoWindow({
      content: '<div style="padding:5px;font-size:12px;font-weight:bold;">📍 Me</div>'
    });
    myInfo.open(map, myMarker);

    // Listen for messages from Flutter to add friend markers
    window.addEventListener('message', function(event) {
      try {
        var data = JSON.parse(event.data);
        if (data.type === 'addFriendMarkers' && data.friends) {
          // Clear old friend markers
          markers.forEach(function(m) { m.setMap(null); });
          markers = [];
          data.friends.forEach(function(f) {
            var pos = new kakao.maps.LatLng(f.lat, f.lng);
            var marker = new kakao.maps.Marker({ position: pos, map: map });
            var info = new kakao.maps.InfoWindow({
              content: '<div style="padding:5px;font-size:12px;">' + f.name + '</div>'
            });
            kakao.maps.event.addListener(marker, 'click', function() {
              info.open(map, marker);
            });
            markers.push(marker);
          });
        }
        if (data.type === 'panTo') {
          map.panTo(new kakao.maps.LatLng(data.lat, data.lng));
        }
      } catch(e) {}
    });
  </script>
</body>
</html>
